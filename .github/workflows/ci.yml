name: ci

on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Validate agent JSON files
        run: |
          for f in agents/*.json; do
            echo "checking $f"
            python3 -c "import json,sys;json.load(open('$f'))"
          done

      - name: Validate n8n workflow JSON files
        run: |
          for f in n8n/*.json; do
            echo "checking $f"
            python3 -c "import json,sys;json.load(open('$f'))"
          done

      - name: Validate package.json
        run: python3 -c "import json;json.load(open('package.json'))"

      - name: Validate HTML files exist and are non-empty
        run: |
          for f in public/index.html public/admin.html public/client.html; do
            test -s "$f" || { echo "missing or empty: $f"; exit 1; }
          done
