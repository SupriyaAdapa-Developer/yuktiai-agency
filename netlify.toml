# Netlify configuration for YuktiAI
# Live at: https://getyuktiai.netlify.app/

[build]
    publish = "public"
    command = "echo 'static site - nothing to build'"

[[redirects]]
    from = "/*"
    to = "/index.html"
    status = 200

[[headers]]
    for = "/*"
    [headers.values]
        X-Frame-Options = "DENY"
        X-Content-Type-Options = "nosniff"
        Referrer-Policy = "strict-origin-when-cross-origin"
